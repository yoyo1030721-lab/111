<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 躲尖刺</title>
  <style>
    html,body{
      margin:0;
      overflow:hidden;
      background:#050816;
      font-family:system-ui,sans-serif;
    }
    #ui{
      position:fixed;
      inset:0;
      pointer-events:none;
      color:white;
    }
    .top{
      display:flex;
      justify-content:space-between;
      padding:16px;
      font-size:20px;
      font-weight:700;
      text-shadow:0 2px 8px rgba(0,0,0,.5);
    }
    .center{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(4px);
      pointer-events:auto;
    }
    .hidden{display:none;}
    button{
      margin-top:12px;
      border:none;
      border-radius:14px;
      padding:12px 24px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      background:linear-gradient(135deg,#67e8f9,#60a5fa);
    }
    .hint{
      position:absolute;
      bottom:14px;
      width:100%;
      text-align:center;
      font-size:14px;
      opacity:.85;
    }
  </style>
</head>
<body>
<div id="ui">
  <div class="top">
    <div id="score">分數：0</div>
    <div id="best">最高：0</div>
  </div>

  <div class="center" id="menu">
    <h1>3D 躲尖刺</h1>
    <p>左右移動、跳躍、閃避尖刺與障礙</p>
    <button id="startBtn">開始遊戲</button>
  </div>

  <div class="hint">← → 移動｜空白鍵跳躍｜手機滑動</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050816, 20, 85);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0,5,10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0x88ccff,0x223344,2);
scene.add(hemi);

const dir = new THREE.DirectionalLight(0xffffff,2);
dir.position.set(4,10,6);
scene.add(dir);

const floorGeo = new THREE.PlaneGeometry(18,200);
const floorMat = new THREE.MeshStandardMaterial({
  color:0x14213d,
  metalness:.2,
  roughness:.8
});
const floor = new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.z = -80;
scene.add(floor);

const laneX = [-4,-2,0,2,4];

const player = new THREE.Group();
scene.add(player);

const body = new THREE.Mesh(
  new THREE.BoxGeometry(1.1,1.5,1.1),
  new THREE.MeshStandardMaterial({color:0x67e8f9})
);
body.position.y = 1;
player.add(body);

const head = new THREE.Mesh(
  new THREE.BoxGeometry(.8,.5,.8),
  new THREE.MeshStandardMaterial({color:0xcffafe})
);
head.position.y = 2;
player.add(head);

player.position.z = 5;

let currentLane = 2;
let targetX = 0;
let velocityY = 0;
let grounded = true;

let score = 0;
let best = Number(localStorage.getItem('best3dSpike')||0);
document.getElementById('best').textContent = '最高：'+best;

const spikes=[];
const coins=[];
const magnets=[];
const stars=[];
const doubles=[];

function makeSpike(){
  const g = new THREE.ConeGeometry(.8,2,4);
  const m = new THREE.MeshStandardMaterial({color:0xff4d6d,emissive:0x661122});
  const s = new THREE.Mesh(g,m);
  s.rotation.x = Math.PI;
  s.position.set(laneX[Math.floor(Math.random()*5)],1,-80);
  scene.add(s);
  spikes.push(s);
}

function makeCoin(){
  const g = new THREE.TorusGeometry(.45,.18,10,20);
  const m = new THREE.MeshStandardMaterial({color:0xffd166,emissive:0x664400});
  const c = new THREE.Mesh(g,m);
  c.rotation.y = Math.PI/2;
  c.position.set(laneX[Math.floor(Math.random()*5)],1.5,-80);
  scene.add(c);
  coins.push(c);
}

function makeMagnet(){
  const g = new THREE.SphereGeometry(.5,16,16);
  const m = new THREE.MeshStandardMaterial({color:0xc084fc, emissive:0x552266});
  const obj = new THREE.Mesh(g,m);
  obj.position.set(laneX[Math.floor(Math.random()*5)],1.5,-80);
  scene.add(obj);
  magnets.push(obj);
}

function makeStar(){
  const g = new THREE.IcosahedronGeometry(.6,0);
  const m = new THREE.MeshStandardMaterial({color:0xfde047, emissive:0x665500});
  const obj = new THREE.Mesh(g,m);
  obj.position.set(laneX[Math.floor(Math.random()*5)],1.5,-80);
  scene.add(obj);
  stars.push(obj);
}

function makeDouble(){
  const g = new THREE.BoxGeometry(.9,.9,.9);
  const m = new THREE.MeshStandardMaterial({color:0x34d399, emissive:0x114433});
  const obj = new THREE.Mesh(g,m);
  obj.position.set(laneX[Math.floor(Math.random()*5)],1.5,-80);
  scene.add(obj);
  doubles.push(obj);
}

let spawn = 0;
let coinSpawn = 0;
let running = false;
let magnetPower = 0;
let starPower = 0;
let doublePower = 0;

function reset(){
  score = 0;
  currentLane = 2;
  targetX = 0;
  player.position.set(0,0,5);
  velocityY = 0;
  grounded = true;

  spikes.forEach(s=>scene.remove(s));
  coins.forEach(c=>scene.remove(c));
  magnets.forEach(c=>scene.remove(c));
  stars.forEach(c=>scene.remove(c));
  doubles.forEach(c=>scene.remove(c));
  spikes.length=0;
  coins.length=0;
  magnets.length=0;
  stars.length=0;
  doubles.length=0;

  magnetPower = 0;
  starPower = 0;
  doublePower = 0;

  running = true;
  document.getElementById('menu').classList.add('hidden');
}

function gameOver(){
  running = false;
  best = Math.max(best,Math.floor(score));
  localStorage.setItem('best3dSpike',best);
  document.getElementById('best').textContent='最高：'+best;
  document.getElementById('menu').classList.remove('hidden');
}

function jump(){
  if(!grounded) return;
  grounded=false;
  velocityY=.24;
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a') currentLane=Math.max(0,currentLane-1);
  if(e.key==='ArrowRight'||e.key==='d') currentLane=Math.min(4,currentLane+1);
  if(e.key===' '||e.key==='ArrowUp') jump();
});

let touchX=0;
addEventListener('pointerdown',e=>{
  touchX=e.clientX;
  if(!running) reset();
  else jump();
});

addEventListener('pointermove',e=>{
  const dx=e.clientX-touchX;
  if(Math.abs(dx)>50){
    currentLane=Math.max(0,Math.min(4,currentLane+(dx>0?1:-1)));
    touchX=e.clientX;
  }
});

document.getElementById('startBtn').onclick=reset;

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(),0.033);

  if(running){
    score += dt*(doublePower>0?20:10);
    document.getElementById('score').textContent='分數：'+Math.floor(score);

    targetX = laneX[currentLane];
    player.position.x += (targetX-player.position.x)*10*dt;

    velocityY -= .012;
    player.position.y += velocityY*60*dt;

    if(player.position.y<=0){
      player.position.y=0;
      velocityY=0;
      grounded=true;
    }

    spawn -= dt;
    coinSpawn -= dt;
    magnetPower = Math.max(0, magnetPower - dt);
    starPower = Math.max(0, starPower - dt);
    doublePower = Math.max(0, doublePower - dt);

    if(spawn<=0){
      makeSpike();
      spawn = Math.max(.25,.7-score/300);
    }

    if(coinSpawn<=0){
      const r=Math.random();
      if(r<0.55) makeCoin();
      else if(r<0.75) makeMagnet();
      else if(r<0.9) makeDouble();
      else makeStar();
      coinSpawn = 1.3;
    }

    for(let i=spikes.length-1;i>=0;i--){
      const s=spikes[i];
      s.position.z += 35*dt;
      s.rotation.y += dt*2;

      if(s.position.distanceTo(player.position)<1.2){
        if(starPower<=0) gameOver();
      }

      if(s.position.z>12){
        scene.remove(s);
        spikes.splice(i,1);
      }
    }

    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i];
      c.position.z += 30*dt;
      c.rotation.z += dt*4;

      if(magnetPower>0){
        const dirX = player.position.x - c.position.x;
        const dirZ = player.position.z - c.position.z;
        c.position.x += dirX * 7 * dt;
        c.position.z += dirZ * 5 * dt;
      }

      if(c.position.distanceTo(player.position)<1.8){
        score += doublePower>0 ? 100 : 50;
        scene.remove(c);
        coins.splice(i,1);
        continue;
      }

      if(c.position.z>12){
        scene.remove(c);
        coins.splice(i,1);
      }
    }

    for(let i=magnets.length-1;i>=0;i--){
      const c=magnets[i];
      c.position.z += 28*dt;
      c.rotation.y += dt*5;
      if(c.position.distanceTo(player.position)<1.8){
        magnetPower=8;
        scene.remove(c);
        magnets.splice(i,1);
      }
    }

    for(let i=doubles.length-1;i>=0;i--){
      const c=doubles[i];
      c.position.z += 28*dt;
      c.rotation.x += dt*5;
      if(c.position.distanceTo(player.position)<1.8){
        doublePower=10;
        scene.remove(c);
        doubles.splice(i,1);
      }
    }

    for(let i=stars.length-1;i>=0;i--){
      const c=stars[i];
      c.position.z += 28*dt;
      c.rotation.y += dt*6;
      if(c.position.distanceTo(player.position)<1.8){
        starPower=7;
        scene.remove(c);
        stars.splice(i,1);
      }
    }

    camera.position.x += (player.position.x-camera.position.x)*3*dt;
    camera.lookAt(player.position.x,1,-8);

    if(magnetPower>0){
      body.rotation.y += dt * 8;
    } else {
      body.rotation.y *= 0.9;
    }
  }

  body.material.color.set(starPower>0 ? 0xfde047 : 0x67e8f9);
  document.getElementById('score').textContent = '分數：'+Math.floor(score)+(magnetPower>0?'｜磁鐵':'')+(doublePower>0?'｜雙倍':'')+(starPower>0?'｜無敵':'');
  renderer.render(scene,camera);
}

animate();
</script>
</body>
</html>
